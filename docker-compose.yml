services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8900:8000"
    env_file: .env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5273:5173"

  celery_worker:
    build: ./backend
    command: celery -A celery_worker.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis

  celery_beat:
    build: ./backend
    command: celery -A celery_worker.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
