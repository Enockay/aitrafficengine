services:
  redis:
    image: redis:7
    expose:
      - "6379"

  backend:
    build: ./backend
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery_worker:
    build: ./backend
    command: celery -A celery_worker.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis

  celery_beat:
    build: ./backend
    command: celery -A celery_worker.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
